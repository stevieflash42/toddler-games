<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ff9f43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ABCs"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>ABCs</title>
<style>
*{box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:#ff6b6b;color:#fff;font-family:system-ui,sans-serif;font-weight:800}
body{position:fixed;inset:0;display:grid;grid-template:"l p" 1fr "w w" auto/1fr 1fr;align-items:center;justify-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:background .2s}
#letter{grid-area:l;font-size:min(40vw,45vh);line-height:1}
#pic{grid-area:p;max-width:90%;max-height:60vh;aspect-ratio:1;object-fit:contain}
#word{grid-area:w;font-size:min(14vw,16vh);padding-bottom:3vh;text-align:center}
@media(orientation:portrait){body{grid-template:"l" 1fr "p" 1fr "w" auto/1fr}#letter{font-size:min(45vw,25vh)}#pic{max-height:35vh}}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ff6b6b;font-size:min(14vw,12vh);z-index:2;cursor:pointer}
#start[hidden]{display:none}
</style>
</head>
<body>
<div id="letter"></div><img id="pic" alt=""><div id="word"></div>
<div id="start">Tap to start</div>
<script>
const $ = id => document.getElementById(id);
const audio = new Audio();
let items = [], i = 0, last = 0;
function show(n) {
  i = (n + items.length) % items.length;
  const { letter, word, color } = items[i], l = letter.toLowerCase();
  const bg = '#' + color.slice(2, 8);
  document.body.style.background = bg;
  document.querySelector('meta[name=theme-color]').content = bg;
  $('letter').textContent = letter + l; $('word').textContent = word; $('pic').src = `images/${l}.png`;
  audio.pause(); audio.src = `sounds/${l}.wav`; audio.play().catch(() => { });
}
// 300 ms throttle matches the Roku channel.
function step(d) { const t = Date.now(); if (t - last < 300) return; last = t; show(i + d); }
$('start').onclick = () => { $('start').hidden = true; show(0); };
addEventListener('pointerdown', e => { if (!$('start').hidden) return; step(e.clientX < innerWidth / 2 ? -1 : 1); });
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('start').hidden) { $('start').click(); return; }
  step(e.key === 'ArrowLeft' ? -1 : 1);
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('gesturestart', e => e.preventDefault());
fetch('words.json').then(r => r.json()).then(j => { items = j; }).catch(() => { $('start').textContent = 'Could not load words'; $('start').onclick = null; });
</script>
</body>
</html>

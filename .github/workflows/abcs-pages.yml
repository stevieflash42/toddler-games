name: Deploy abcs
on:
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site/images
          cp web-games/abcs/index.html web-games/abcs/manifest.webmanifest web-games/abcs/icon-*.png _site/
          cp roku-games/abcs/words.json _site/
          cp -r roku-games/abcs/sounds _site/
          cp roku-games/abcs/images/?.png _site/images/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
